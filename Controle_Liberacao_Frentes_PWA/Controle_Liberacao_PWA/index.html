<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Controle de Liberação de Frentes</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="app.css"></head><body>
<header><h1>Controle de Liberação de Frentes</h1><div class="sub">TIC — controle de frentes, interferências e liberações</div></header>
<main>
<section class="card"><div class="filters"><div><label>Trecho</label><select id="trecho"></select></div><div><label>Tipo</label><select id="tipo"></select></div><div><label>Solução</label><select id="solucao"></select></div><div><label>Lado</label><select id="lado"></select></div></div><div style="display:flex;justify-content:flex-end;margin-top:8px"><button id="clear" class="btnlight">Limpar filtros</button></div></section>
<section class="card"><div class="kmhead"><b>Intervalo de KM</b><span class="kmvals"><span id="v1">62+000</span> — <span id="v2">105+000</span></span></div><div class="range"><div class="track"></div><div class="fill" id="fill"></div><input id="r1" type="range" min="62" max="105" step="0.001" value="62"><input id="r2" type="range" min="62" max="105" step="0.001" value="105"></div></section>
<section class="card"><div class="kmhead"><b>Distribuição das frentes</b><span class="count" id="count"></span></div><div class="axiswrap"><div class="axis" id="axis"><div class="mainline"></div><div class="lane le" id="laneLE"></div><div class="lane ld" id="laneLD"></div></div></div><div class="legend" id="legend"></div><div id="appError" style="color:#b91c1c;font-size:12px;margin-top:6px"></div></section>
<section class="card"><div class="kmhead"><b>Frentes filtradas</b></div><div class="tablewrap"><table><thead><tr><th>Identificação</th><th>Trecho</th><th>Tipo</th><th>Solução</th><th>Lado</th><th>KM Inicial</th><th>KM Final</th><th>Extensão</th><th>Liberado</th><th>Observação</th><th>Foto</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle" style="margin:0;font-size:18px"></h2><button id="cancel">Fechar</button></div><div class="details" id="details"></div><label>Observação</label><textarea id="obs" placeholder="Digite uma observação..."></textarea><div style="margin-top:10px"><label>Foto</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="photoPreview"></div><div class="modalactions"><button id="save">Salvar</button></div></div></div>
<script src="app_data.js"></script><script src="app.js"></script><script>if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script></body></html>
